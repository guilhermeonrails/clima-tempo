<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Painel de Clima</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-blue-200 to-white min-h-screen p-6 font-sans">

  <h1 class="text-4xl font-bold text-center text-blue-800 mb-10">🌎 Painel de Clima - Capitais do Mundo</h1>

  <div id="cartoes" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6 max-w-6xl mx-auto"></div>

  <script>
    const cidades = [
      { nome: "São Paulo", temperatura: "26°C", clima: "Parcialmente Nublado", umidade: "55%" },
      { nome: "Rio de Janeiro", temperatura: "31°C", clima: "Muito Quente", umidade: "60%" },
      { nome: "Buenos Aires", temperatura: "22°C", clima: "Chuva Leve", umidade: "70%" },
      { nome: "Londres", temperatura: "15°C", clima: "Nublado", umidade: "80%" },
      { nome: "Paris", temperatura: "17°C", clima: "Chuvisco", umidade: "75%" },
      { nome: "Tóquio", temperatura: "24°C", clima: "Ensolarado", umidade: "65%" },
      { nome: "Pequim", temperatura: "19°C", clima: "Neblina", umidade: "58%" },
      { nome: "Cidade do México", temperatura: "27°C", clima: "Parcialmente Nublado", umidade: "50%" },
      { nome: "Nova York", temperatura: "20°C", clima: "Trovoadas", umidade: "67%" },
      { nome: "Lisboa", temperatura: "25°C", clima: "Sol Firme", umidade: "45%" },
      { nome: "Berlim", temperatura: "16°C", clima: "Nublado", umidade: "72%" },
      { nome: "Moscou", temperatura: "10°C", clima: "Chuva Fraca", umidade: "81%" },
      { nome: "Cairo", temperatura: "35°C", clima: "Seco", umidade: "20%" },
      { nome: "Canberra", temperatura: "12°C", clima: "Frio e Seco", umidade: "35%" },
      { nome: "Ottawa", temperatura: "7°C", clima: "Nevando", umidade: "90%" }
    ];

    const container = document.getElementById("cartoes");

    cidades.forEach(cidade => {
      container.innerHTML += `
        <div class="bg-white p-6 rounded-2xl shadow-xl border border-blue-100">
          <h2 class="text-2xl font-semibold text-blue-700 mb-2">${cidade.nome}</h2>
          <p class="text-gray-600">Temperatura: <span class="font-bold">${cidade.temperatura}</span></p>
          <p class="text-gray-600">Clima: <span class="font-bold">${cidade.clima}</span></p>
          <p class="text-gray-600">Umidade: <span class="font-bold">${cidade.umidade}</span></p>
        </div>
      `;
    });
  </script>
</body>
</html>
